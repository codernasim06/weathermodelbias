# Project Configuration: Experiment Settings & Hyperparameters

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  models_output: "models/trained"
  figures_output: "reports/figures"
  logs_output: "logs"

training:
  random_seed: 42
  test_size: 0.2
  val_size: 0.1
  # Model specific parameters
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
  linear_regression:
    fit_intercept: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: "logs/experiment.log"

environment:
  device: "cpu" # Change to "cuda" if using GPU